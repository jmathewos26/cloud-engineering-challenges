name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: pytest problem1-data-standardization -v

  build:
    name: Validate and build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose file
        run: docker compose -f problem2-monitoring/docker-compose.yml config -q
      - name: Build the app image
        run: docker build -t demo-app:${{ github.sha }} problem2-monitoring/app